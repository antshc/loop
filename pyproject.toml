[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.0.0"
description = "Library for composing agent workflows on git worktrees."
requires-python = ">=3.14"
dependencies = [
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
visualization = ["rich>=13"]
workflows = ["dishka>=1.10"]
dev = ["pytest", "import-linter", "dishka>=1.10", "opentelemetry-sdk>=1.45", "opentelemetry-exporter-otlp-proto-http>=1.45"]
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests", "software_factory/tests"]
norecursedirs = ["archive", ".*"]

[tool.importlinter]
root_packages = ["loop", "workflows", "software_factory"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The loop library is layered: builder over agents over clis, docker and git over run over hooks over sessions"
type = "layers"
layers = [
    "factory | workflow",
    "builder | dryrun",
    "agents",
    "clis | docker | git",
    "run",
    "hooks",
    "sessions",
    "observe",
]
containers = ["loop"]

[[tool.importlinter.contracts]]
name = "The factory and the examples import only the public loop package"
type = "forbidden"
source_modules = ["workflows", "software_factory"]
forbidden_modules = [
    "loop.agents",
    "loop.builder",
    "loop.clis",
    "loop.docker",
    "loop.dryrun",
    "loop.factory",
    "loop.git",
    "loop.hooks",
    "loop.observe",
    "loop.run",
    "loop.sessions",
    "loop.workflow",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Implement-spec stages run the delegates they are given, never a concrete agent"
type = "forbidden"
source_modules = [
    "software_factory.legacy_slices.implement_spec.backlog",
    "software_factory.legacy_slices.implement_spec.chore",
    "software_factory.legacy_slices.implement_spec.deliver",
    "software_factory.legacy_slices.implement_spec.model",
    "software_factory.legacy_slices.implement_spec.plan",
    "software_factory.legacy_slices.implement_spec.review",
]
forbidden_modules = ["software_factory.legacy_slices.implement_spec.agents"]

[[tool.importlinter.contracts]]
name = "Implement-spec features never reach back into their composition root"
type = "forbidden"
source_modules = [
    "software_factory.legacy_slices.implement_spec.agents",
    "software_factory.legacy_slices.implement_spec.backlog",
    "software_factory.legacy_slices.implement_spec.chore",
    "software_factory.legacy_slices.implement_spec.deliver",
    "software_factory.legacy_slices.implement_spec.model",
    "software_factory.legacy_slices.implement_spec.plan",
    "software_factory.legacy_slices.implement_spec.review",
]
forbidden_modules = ["software_factory.legacy_slices.implement_spec.composition"]

[[tool.importlinter.contracts]]
name = "Implement-spec stages are independent; only the backlog router sequences them"
type = "independence"
modules = [
    "software_factory.legacy_slices.implement_spec.chore",
    "software_factory.legacy_slices.implement_spec.deliver",
    "software_factory.legacy_slices.implement_spec.plan",
    "software_factory.legacy_slices.implement_spec.review",
]

[[tool.importlinter.contracts]]
name = "Shared workflow infrastructure imports no workflow slice"
type = "forbidden"
source_modules = ["software_factory.shared"]
forbidden_modules = ["software_factory.legacy_slices.implement_spec", "software_factory.legacy_slices.pr_babysit", "workflows.plan_implement", "workflows.workflow_reporting"]

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub issues package never import the gh process layer; only its reader, commands, ticketing service, and client do"
type = "forbidden"
source_modules = ["software_factory.shared.github.issues"]
forbidden_modules = [
    "software_factory.shared.process",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
    "software_factory.shared.github.pull_requests",
]
ignore_imports = [
    "software_factory.shared.github.issues.reader -> software_factory.shared.process",
    "software_factory.shared.github.issues.reader -> software_factory.shared.github.repo",
    "software_factory.shared.github.issues.commands -> software_factory.shared.github.repo",
    "software_factory.shared.github.issues.ticketing -> software_factory.shared.process",
    "software_factory.shared.github.issues.client -> software_factory.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub pull_requests package never import the gh process layer; only its reader, policy reader, and client do"
type = "forbidden"
source_modules = ["software_factory.shared.github.pull_requests"]
forbidden_modules = [
    "software_factory.shared.process",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
]
ignore_imports = [
    "software_factory.shared.github.pull_requests.reader -> software_factory.shared.github.repo",
    "software_factory.shared.github.pull_requests.client -> software_factory.shared.github.repo",
    "software_factory.shared.github.pull_requests.policy_reader -> software_factory.shared.process",
    "software_factory.shared.github.pull_requests.policy_reader -> software_factory.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Factory and example source packages never import the factory test tree"
type = "forbidden"
source_modules = ["software_factory.shared", "software_factory.legacy_slices.implement_spec", "software_factory.legacy_slices.pr_babysit", "workflows.plan_implement", "workflows.workflow_reporting"]
forbidden_modules = ["software_factory.tests"]

[[tool.importlinter.contracts]]
name = "Only composition roots and the shared provider know the container"
type = "forbidden"
source_modules = [
    "software_factory.shared.agents",
    "software_factory.shared.git",
    "software_factory.shared.github",
    "software_factory.shared.process",
    "software_factory.shared.state",
    "software_factory.shared.telemetry",
    "software_factory.legacy_slices.pr_babysit.address",
    "software_factory.legacy_slices.pr_babysit.agents",
    "software_factory.legacy_slices.pr_babysit.discover",
    "software_factory.legacy_slices.pr_babysit.maintain_ci",
    "software_factory.legacy_slices.pr_babysit.model",
    "software_factory.legacy_slices.pr_babysit.monitor",
    "software_factory.legacy_slices.pr_babysit.publish",
    "software_factory.legacy_slices.pr_babysit.settings",
    "software_factory.legacy_slices.pr_babysit.watch",
    "software_factory.legacy_slices.implement_spec.agents",
    "software_factory.legacy_slices.implement_spec.backlog",
    "software_factory.legacy_slices.implement_spec.chore",
    "software_factory.legacy_slices.implement_spec.deliver",
    "software_factory.legacy_slices.implement_spec.model",
    "software_factory.legacy_slices.implement_spec.plan",
    "software_factory.legacy_slices.implement_spec.review",
]
forbidden_modules = ["dishka"]

[[tool.importlinter.contracts]]
name = "Babysit features never reach back into their composition root"
type = "forbidden"
source_modules = [
    "software_factory.legacy_slices.pr_babysit.address",
    "software_factory.legacy_slices.pr_babysit.agents",
    "software_factory.legacy_slices.pr_babysit.discover",
    "software_factory.legacy_slices.pr_babysit.maintain_ci",
    "software_factory.legacy_slices.pr_babysit.model",
    "software_factory.legacy_slices.pr_babysit.monitor",
    "software_factory.legacy_slices.pr_babysit.publish",
    "software_factory.legacy_slices.pr_babysit.settings",
    "software_factory.legacy_slices.pr_babysit.watch",
]
forbidden_modules = ["software_factory.legacy_slices.pr_babysit.composition"]

[[tool.importlinter.contracts]]
name = "No workflow imports another workflow"
type = "independence"
modules = ["software_factory.legacy_slices.implement_spec", "workflows.plan_implement", "workflows.workflow_reporting", "software_factory.legacy_slices.pr_babysit"]

[[tool.importlinter.contracts]]
name = "PR maintenance decisions do not depend on the discovery scheduler"
type = "forbidden"
source_modules = [
    "software_factory.legacy_slices.pr_babysit.address",
    "software_factory.legacy_slices.pr_babysit.agents",
    "software_factory.legacy_slices.pr_babysit.maintain_ci",
    "software_factory.legacy_slices.pr_babysit.monitor",
    "software_factory.legacy_slices.pr_babysit.publish",
    "software_factory.legacy_slices.pr_babysit.watch",
]
forbidden_modules = ["software_factory.legacy_slices.pr_babysit.discover"]
