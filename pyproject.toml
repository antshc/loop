[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.0.0"
description = "Library for composing agent workflows on git worktrees."
requires-python = ">=3.14"
dependencies = [
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
visualization = ["rich>=13"]
workflows = ["dishka>=1.10"]
dev = ["pytest", "import-linter", "dishka>=1.10", "opentelemetry-sdk>=1.45", "opentelemetry-exporter-otlp-proto-http>=1.45"]
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests", "workflows/tests"]
norecursedirs = ["archive", ".*"]

[tool.importlinter]
root_packages = ["loop", "workflows"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The loop library is layered: builder over agents over clis, docker and git over run over hooks over sessions"
type = "layers"
layers = [
    "factory | workflow",
    "builder | dryrun",
    "agents",
    "clis | docker | git",
    "run",
    "hooks",
    "sessions",
    "observe",
]
containers = ["loop"]

[[tool.importlinter.contracts]]
name = "The workflows import only the public loop package"
type = "forbidden"
source_modules = ["workflows"]
forbidden_modules = [
    "loop.agents",
    "loop.builder",
    "loop.clis",
    "loop.docker",
    "loop.dryrun",
    "loop.factory",
    "loop.git",
    "loop.hooks",
    "loop.observe",
    "loop.run",
    "loop.sessions",
    "loop.workflow",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Dev stages run the delegates they are given, never a concrete agent"
type = "forbidden"
source_modules = [
    "workflows.dev.backlog",
    "workflows.dev.chore",
    "workflows.dev.deliver",
    "workflows.dev.model",
    "workflows.dev.plan",
    "workflows.dev.review",
    "workflows.dev.verify",
]
forbidden_modules = ["workflows.dev.agents"]

[[tool.importlinter.contracts]]
name = "Dev features never reach back into their composition root"
type = "forbidden"
source_modules = [
    "workflows.dev.agents",
    "workflows.dev.backlog",
    "workflows.dev.chore",
    "workflows.dev.deliver",
    "workflows.dev.model",
    "workflows.dev.plan",
    "workflows.dev.review",
    "workflows.dev.verify",
]
forbidden_modules = ["workflows.dev.composition"]

[[tool.importlinter.contracts]]
name = "Dev stages are independent; only the backlog router sequences them"
type = "independence"
modules = [
    "workflows.dev.chore",
    "workflows.dev.deliver",
    "workflows.dev.plan",
    "workflows.dev.review",
    "workflows.dev.verify",
]

[[tool.importlinter.contracts]]
name = "Shared workflow infrastructure imports no workflow slice"
type = "forbidden"
source_modules = ["workflows.shared"]
forbidden_modules = ["workflows.dev", "workflows.pr_babysit", "workflows.plan_implement", "workflows.workflow_reporting"]

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub issues package never import the gh process layer; only its reader, commands, and client do"
type = "forbidden"
source_modules = ["workflows.shared.github.issues"]
forbidden_modules = [
    "workflows.shared.process",
    "workflows.shared.github.repo",
    "workflows.shared.github.account",
    "workflows.shared.github.pull_requests",
]
ignore_imports = [
    "workflows.shared.github.issues.reader -> workflows.shared.process",
    "workflows.shared.github.issues.reader -> workflows.shared.github.repo",
    "workflows.shared.github.issues.commands -> workflows.shared.github.repo",
    "workflows.shared.github.issues.client -> workflows.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub pull_requests package never import the gh process layer; only its reader, policy reader, and client do"
type = "forbidden"
source_modules = ["workflows.shared.github.pull_requests"]
forbidden_modules = [
    "workflows.shared.process",
    "workflows.shared.github.repo",
    "workflows.shared.github.account",
]
ignore_imports = [
    "workflows.shared.github.pull_requests.reader -> workflows.shared.github.repo",
    "workflows.shared.github.pull_requests.client -> workflows.shared.github.repo",
    "workflows.shared.github.pull_requests.policy_reader -> workflows.shared.process",
    "workflows.shared.github.pull_requests.policy_reader -> workflows.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Workflow source packages never import the Workflow test tree"
type = "forbidden"
source_modules = ["workflows.shared", "workflows.dev", "workflows.pr_babysit", "workflows.plan_implement", "workflows.workflow_reporting"]
forbidden_modules = ["workflows.tests"]

[[tool.importlinter.contracts]]
name = "Only composition roots and the shared provider know the container"
type = "forbidden"
source_modules = [
    "workflows.shared.agents",
    "workflows.shared.git",
    "workflows.shared.github",
    "workflows.shared.process",
    "workflows.shared.state",
    "workflows.shared.telemetry",
    "workflows.pr_babysit.address",
    "workflows.pr_babysit.agents",
    "workflows.pr_babysit.discover",
    "workflows.pr_babysit.maintain_ci",
    "workflows.pr_babysit.model",
    "workflows.pr_babysit.monitor",
    "workflows.pr_babysit.publish",
    "workflows.pr_babysit.settings",
    "workflows.pr_babysit.watch",
    "workflows.dev.agents",
    "workflows.dev.backlog",
    "workflows.dev.chore",
    "workflows.dev.deliver",
    "workflows.dev.model",
    "workflows.dev.plan",
    "workflows.dev.review",
    "workflows.dev.verify",
]
forbidden_modules = ["dishka"]

[[tool.importlinter.contracts]]
name = "Babysit features never reach back into their composition root"
type = "forbidden"
source_modules = [
    "workflows.pr_babysit.address",
    "workflows.pr_babysit.agents",
    "workflows.pr_babysit.discover",
    "workflows.pr_babysit.maintain_ci",
    "workflows.pr_babysit.model",
    "workflows.pr_babysit.monitor",
    "workflows.pr_babysit.publish",
    "workflows.pr_babysit.settings",
    "workflows.pr_babysit.watch",
]
forbidden_modules = ["workflows.pr_babysit.composition"]

[[tool.importlinter.contracts]]
name = "No workflow imports another workflow"
type = "independence"
modules = ["workflows.dev", "workflows.plan_implement", "workflows.workflow_reporting", "workflows.pr_babysit"]

[[tool.importlinter.contracts]]
name = "PR maintenance decisions do not depend on the discovery scheduler"
type = "forbidden"
source_modules = [
    "workflows.pr_babysit.address",
    "workflows.pr_babysit.agents",
    "workflows.pr_babysit.maintain_ci",
    "workflows.pr_babysit.monitor",
    "workflows.pr_babysit.publish",
    "workflows.pr_babysit.watch",
]
forbidden_modules = ["workflows.pr_babysit.discover"]
