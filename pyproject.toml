[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.0.0"
description = "Library for composing agent workflows on git worktrees."
requires-python = ">=3.14"
dependencies = [
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
visualization = ["rich>=13"]
workflows = ["dishka>=1.10"]
dev = ["pytest", "import-linter", "dishka>=1.10", "opentelemetry-sdk>=1.45", "opentelemetry-exporter-otlp-proto-http>=1.45"]
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests", "software_factory/tests"]
norecursedirs = ["archive", ".*"]

[tool.importlinter]
root_packages = ["loop", "workflows", "software_factory"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The loop library is layered: builder over agents over clis, docker and git over run over hooks over sessions"
type = "layers"
layers = [
    "factory | workflow",
    "builder | dryrun",
    "agents",
    "clis | docker | git",
    "run",
    "hooks",
    "sessions",
    "observe",
]
containers = ["loop"]

[[tool.importlinter.contracts]]
name = "The factory and the examples import only the public loop package"
type = "forbidden"
source_modules = ["workflows", "software_factory"]
forbidden_modules = [
    "loop.agents",
    "loop.builder",
    "loop.clis",
    "loop.docker",
    "loop.dryrun",
    "loop.factory",
    "loop.git",
    "loop.hooks",
    "loop.observe",
    "loop.run",
    "loop.sessions",
    "loop.workflow",
]
# The telemetry test builds Loop's observer over an in-memory exporter, which the public otlp_observer cannot take.
ignore_imports = ["software_factory.tests.shared.test_telemetry -> loop.observe.otel"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared workflow infrastructure imports no workflow slice"
type = "forbidden"
source_modules = ["software_factory.shared"]
forbidden_modules = ["software_factory.workflows", "workflows.plan_implement", "workflows.workflow_reporting"]

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub issues package never import the gh process layer; only its reader, commands, ticketing service, and client do"
type = "forbidden"
source_modules = ["software_factory.shared.github.issues"]
forbidden_modules = [
    "software_factory.shared.process",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
    "software_factory.shared.github.pull_requests",
]
ignore_imports = [
    "software_factory.shared.github.issues.reader -> software_factory.shared.process",
    "software_factory.shared.github.issues.reader -> software_factory.shared.github.repo",
    "software_factory.shared.github.issues.commands -> software_factory.shared.github.repo",
    "software_factory.shared.github.issues.ticketing -> software_factory.shared.process",
    "software_factory.shared.github.issues.client -> software_factory.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Pure modules of the shared GitHub pull_requests package never import the gh process layer; only its reader, policy reader, and client do"
type = "forbidden"
source_modules = ["software_factory.shared.github.pull_requests"]
forbidden_modules = [
    "software_factory.shared.process",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
]
ignore_imports = [
    "software_factory.shared.github.pull_requests.reader -> software_factory.shared.github.repo",
    "software_factory.shared.github.pull_requests.client -> software_factory.shared.github.repo",
    "software_factory.shared.github.pull_requests.policy_reader -> software_factory.shared.process",
    "software_factory.shared.github.pull_requests.policy_reader -> software_factory.shared.github.repo",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Factory and example source packages never import the factory test tree"
type = "forbidden"
source_modules = ["software_factory.agents", "software_factory.runtime", "software_factory.events", "software_factory.stages", "software_factory.flows", "software_factory.shared", "software_factory.workflows", "workflows.plan_implement", "workflows.workflow_reporting"]
forbidden_modules = ["software_factory.tests"]

[[tool.importlinter.contracts]]
name = "Only composition roots and the shared provider know the container"
type = "forbidden"
source_modules = [
    "software_factory.agents",
    "software_factory.runtime",
    "software_factory.events",
    "software_factory.stages",
    "software_factory.flows",
    "software_factory.workflows",
    "software_factory.shared.agents",
    "software_factory.shared.git",
    "software_factory.shared.github",
    "software_factory.shared.process",
    "software_factory.shared.state",
    "software_factory.shared.telemetry",
]
forbidden_modules = ["dishka"]

[[tool.importlinter.contracts]]
name = "No workflow imports another workflow"
type = "independence"
modules = ["software_factory.workflows.implement_spec", "software_factory.workflows.pr_babysit", "workflows.plan_implement", "workflows.workflow_reporting"]

[[tool.importlinter.contracts]]
name = "Agent roles are independent of each other"
type = "independence"
modules = ["software_factory.agents.roles.*"]

[[tool.importlinter.contracts]]
name = "Role agents and shared infrastructure, including the GitHub package, never import each other"
type = "independence"
modules = ["software_factory.agents", "software_factory.shared"]

[[tool.importlinter.contracts]]
name = "The private agent kit is unreachable outside the agents package"
type = "forbidden"
source_modules = ["software_factory.workflows", "software_factory.runtime", "software_factory.events", "software_factory.stages", "software_factory.flows", "software_factory.shared", "workflows"]
forbidden_modules = ["software_factory.agents._kit"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The runtime engine is private: only the runtime package reaches it"
type = "forbidden"
source_modules = ["software_factory.agents", "software_factory.workflows", "software_factory.events", "software_factory.stages", "software_factory.flows", "software_factory.shared", "workflows"]
forbidden_modules = ["software_factory.runtime._engine"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The Workflow definition runtime is generic: no GitHub, role agents, shared infrastructure, Events, Stages, Flow fragments or processes"
type = "forbidden"
source_modules = ["software_factory.runtime"]
forbidden_modules = [
    "software_factory.shared",
    "software_factory.agents.roles",
    "software_factory.events",
    "software_factory.stages",
    "software_factory.flows",
    "subprocess",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Stages are independent: they share Events, never each other; composition across Stage modules belongs to Flow fragments and Workflow definitions"
type = "independence"
modules = ["software_factory.stages.*"]

[[tool.importlinter.contracts]]
name = "Events are pure data: no Git, no GitHub clients"
type = "forbidden"
source_modules = ["software_factory.events"]
forbidden_modules = [
    "software_factory.shared.git",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
    "software_factory.stages",
    "software_factory.flows",
]

[[tool.importlinter.contracts]]
name = "Flow fragments sit above the Stages: Stages, Events, role agents and shared infrastructure never import them"
type = "forbidden"
source_modules = ["software_factory.stages", "software_factory.events", "software_factory.agents", "software_factory.shared"]
forbidden_modules = ["software_factory.flows"]

[[tool.importlinter.contracts]]
name = "Stages and Flow fragments never start processes themselves"
type = "forbidden"
source_modules = ["software_factory.stages", "software_factory.flows"]
forbidden_modules = ["software_factory.shared.process", "subprocess"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Workflow definitions sit on top: nothing below them imports one"
type = "forbidden"
source_modules = [
    "software_factory.runtime",
    "software_factory.events",
    "software_factory.agents",
    "software_factory.stages",
    "software_factory.flows",
    "software_factory.shared",
]
forbidden_modules = ["software_factory.workflows"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "A Workflow's policy module holds values and pure functions: no process, Git or GitHub client"
type = "forbidden"
source_modules = ["software_factory.workflows.implement_spec.policy", "software_factory.workflows.pr_babysit.policy"]
forbidden_modules = [
    "software_factory.shared.process",
    "software_factory.shared.git",
    "software_factory.shared.github.repo",
    "software_factory.shared.github.account",
    "software_factory.shared.github.issues.client",
    "software_factory.shared.github.pull_requests.client",
    "subprocess",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "A Workflow's definition, policy and intake never start processes; only its entry point and dry-run seams do"
type = "forbidden"
source_modules = ["software_factory.workflows.implement_spec"]
forbidden_modules = ["software_factory.shared.process", "subprocess"]
# The definition names the hook and process errors its error route turns into a hand-off.
ignore_imports = [
    "software_factory.workflows.implement_spec -> subprocess",
    "software_factory.workflows.implement_spec.__main__ -> software_factory.shared.process",
    "software_factory.workflows.implement_spec.dry -> software_factory.shared.process",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pr_babysit's definition, policy and adoption never start processes; only its entry point and its discovery intake, which spawns one child process per pull request, do"
type = "forbidden"
source_modules = ["software_factory.workflows.pr_babysit"]
forbidden_modules = ["software_factory.shared.process", "subprocess"]
# The definition and the entry point name the process errors that turn into a hand-off or an exit code.
ignore_imports = [
    "software_factory.workflows.pr_babysit -> subprocess",
    "software_factory.workflows.pr_babysit.intake -> subprocess",
    "software_factory.workflows.pr_babysit.__main__ -> subprocess",
    "software_factory.workflows.pr_babysit.__main__ -> software_factory.shared.process",
]
allow_indirect_imports = true
