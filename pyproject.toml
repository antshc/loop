[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.0.0"
description = "Library for composing agent workflows on git worktrees."
requires-python = ">=3.12"
dependencies = [
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "import-linter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
norecursedirs = ["archive", ".*"]

[tool.importlinter]
root_packages = ["loop", "workflows"]

[[tool.importlinter.contracts]]
name = "The loop library is layered: builder over agents over clis, docker and git over run over hooks over sessions"
type = "layers"
layers = [
    "__main__",
    "factory",
    "builder | dryrun",
    "agents",
    "clis | docker | git",
    "run",
    "hooks",
    "sessions",
]
containers = ["loop"]

[[tool.importlinter.contracts]]
name = "The workflows import only the public loop package"
type = "forbidden"
source_modules = ["workflows"]
forbidden_modules = [
    "loop.agents",
    "loop.builder",
    "loop.clis",
    "loop.docker",
    "loop.dryrun",
    "loop.factory",
    "loop.git",
    "loop.hooks",
    "loop.run",
    "loop.sessions",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared workflow platforms import no workflow"
type = "forbidden"
source_modules = ["workflows.platforms"]
forbidden_modules = ["workflows.dev", "workflows.plan_implement"]

[[tool.importlinter.contracts]]
name = "No workflow imports another workflow"
type = "independence"
modules = ["workflows.dev", "workflows.plan_implement"]
