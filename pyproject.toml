[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.0.0"
description = "Library for composing agent workflows on git worktrees."
requires-python = ">=3.12"
dependencies = [
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "import-linter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
norecursedirs = ["archive", ".*"]

[tool.importlinter]
root_packages = ["loop", "workflows"]

[[tool.importlinter.contracts]]
name = "Contracts and shared policy import no implementation"
type = "forbidden"
source_modules = [
    "loop.contracts",
    "loop.errors",
    "loop.process",
    "loop.prompt",
    "loop.tags",
    "loop.parallel",
]
forbidden_modules = [
    "loop.agents",
    "loop.runs",
    "loop.platforms",
    "loop.stores",
    "loop.testing",
]

[[tool.importlinter.contracts]]
name = "Adapters import no run code"
type = "forbidden"
source_modules = ["loop.agents", "loop.platforms", "loop.stores"]
forbidden_modules = ["loop.runs"]

[[tool.importlinter.contracts]]
name = "The git platform module imports no workflow code"
type = "forbidden"
source_modules = ["loop.platforms.git"]
forbidden_modules = ["workflows"]

[[tool.importlinter.contracts]]
name = "Only loop.testing imports loop.testing"
type = "forbidden"
source_modules = [
    "loop.agents",
    "loop.runs",
    "loop.platforms",
    "loop.stores",
    "loop.contracts",
    "loop.errors",
    "loop.process",
    "loop.prompt",
    "loop.tags",
    "loop.parallel",
    "workflows",
]
forbidden_modules = ["loop.testing"]

[[tool.importlinter.contracts]]
name = "The dev workflow and shared workflow platforms import only the public loop API"
type = "forbidden"
source_modules = ["workflows.dev", "workflows.platforms"]
forbidden_modules = [
    "loop.contracts",
    "loop.agents",
    "loop.runs",
    "loop.platforms",
    "loop.stores",
    "loop.errors",
    "loop.process",
    "loop.prompt",
    "loop.tags",
    "loop.parallel",
    "loop.testing",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared workflow platforms import no workflow"
type = "forbidden"
source_modules = ["workflows.platforms"]
forbidden_modules = ["workflows.dev"]
