name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [minimum, latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun at the pinned minimum
        if: matrix.bun == 'minimum'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up the latest Bun
        if: matrix.bun == 'latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "Loop CI"
          git config --global user.email "loop-ci@example.invalid"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
