name: Python tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "Loop CI"
          git config --global user.email "loop-ci@example.invalid"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" --config-settings editable_mode=strict

      - name: Check Python lint
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run Python tests
        run: python -m pytest
